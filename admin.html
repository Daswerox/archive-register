<div id="controls">
  <h2>Управление архивом</h2>

  <!-- Выпадающие списки для выбора -->
  <label>Полка:</label>
  <select id="shelfSelect"></select>
  <label>Этаж:</label>
  <select id="floorSelect"></select>
  <label>Коробка:</label>
  <select id="boxSelect"></select>

  <!-- Добавление нового дела -->
  <label>Содержимое коробки:</label>
  <div id="caseList"></div>
  <input type="text" id="newCaseInput" placeholder="Добавить новое дело">

  <!-- Разделение кнопок по функционалу -->
  <div style="margin-top:10px;">
    <button id="addBtn">Добавить</button>
    <button id="editBtn">Редактировать выбранное дело</button>
    <button id="deleteBtn">Удалить выбранное дело / коробку / этаж / полку</button>
  </div>

  <!-- Экспорт таблицы -->
  <button id="exportBtn" style="margin-top:10px;">Показать / Скрыть список</button>
</div>

<div id="tableContainer" style="display:none;"></div>
