<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Админка архива</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f4f8;margin:0;padding:0;}
header{background:#2563eb;color:white;text-align:center;padding:16px;position:sticky;top:0;z-index:100;}
header h1{margin:0;font-size:32px;}
#controls{padding:16px;margin:16px;background:white;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,0.1);}
#controls label{display:block;margin-top:12px;font-weight:bold;font-size:24px;}
#controls select,input,button{font-size:24px;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #cbd5e1;width:100%;box-sizing:border-box;}
#controls button{background:#2563eb;color:white;border:none;cursor:pointer;margin-top:4px;}
.scrollable{max-height:300px;overflow-y:auto;border:1px solid #cbd5e1;padding:10px;margin-top:6px;border-radius:10px;}
.case-item{display:flex;flex-wrap:wrap;justify-content:space-between;margin-bottom:8px;font-size:22px;}
.case-item input{flex:1 1 60%;margin-right:6px;margin-bottom:4px;font-size:22px;padding:6px;}
.case-item button{flex:1 1 18%;margin-bottom:4px;font-size:20px;padding:6px;border-radius:8px;border:none;}
.case-item .edit-btn{background:#f59e0b;color:white;}
.case-item .delete-btn{background:#ef4444;color:white;}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:22px;}
th,td{border:1px solid #cbd5e1;padding:8px;text-align:left;}
#tableContainer{max-height:300px;overflow-y:auto;margin-top:12px;}
</style>
</head>
<body>
<header><h1>Админка архива</h1></header>

<div id="controls">

  <!-- Полка -->
  <label>Полка</label>
  <select id="shelfSelect"></select>
  <button id="addShelfBtn">➕ Добавить полку</button>
  <button id="editShelfBtn">Редактировать полку</button>
  <button id="deleteShelfBtn">Удалить полку</button>

  <!-- Этаж -->
  <label>Этаж</label>
  <select id="floorSelect"></select>
  <button id="addFloorBtn">➕ Добавить этаж (в выбранную полку)</button>
  <button id="editFloorBtn">Редактировать этаж</button>
  <button id="deleteFloorBtn">Удалить этаж</button>

  <!-- Коробка -->
  <label>Коробка</label>
  <select id="boxSelect"></select>
  <button id="addBoxBtn">➕ Добавить коробку (в выбранный этаж)</button>
  <button id="editBoxBtn">Редактировать коробку</button>
  <button id="deleteBoxBtn">Удалить коробку</button>

  <!-- Содержимое -->
  <label>Содержимое коробки</label>
  <div class="scrollable" id="caseList"></div>
  <input type="text" id="newCaseInput" placeholder="Новое дело">
  <button id="addCaseBtn">Добавить дело</button>

  <!-- Таблица -->
  <button id="toggleTableBtn">Показать список</button>
  <div id="tableContainer" style="display:none;"></div>

  <!-- JSON -->
  
  <button id="openJsonBtn">Открыть JSON</button>

</div>
<script>
let archive = { shelves: [] };

// селекты и кнопки
const shelfSelect = document.getElementById('shelfSelect');
const floorSelect = document.getElementById('floorSelect');
const boxSelect = document.getElementById('boxSelect');
const caseList = document.getElementById('caseList');
const newCaseInput = document.getElementById('newCaseInput');
const addCaseBtn = document.getElementById('addCaseBtn');
const toggleTableBtn = document.getElementById('toggleTableBtn');
const tableContainer = document.getElementById('tableContainer');

const addShelfBtn = document.getElementById('addShelfBtn');
const addFloorBtn = document.getElementById('addFloorBtn');
const addBoxBtn = document.getElementById('addBoxBtn');

const editShelfBtn = document.getElementById('editShelfBtn');
const deleteShelfBtn = document.getElementById('deleteShelfBtn');
const editFloorBtn = document.getElementById('editFloorBtn');
const deleteFloorBtn = document.getElementById('deleteFloorBtn');
const editBoxBtn = document.getElementById('editBoxBtn');
const deleteBoxBtn = document.getElementById('deleteBoxBtn');
const copyJsonBtn = document.getElementById('copyJsonBtn');
const openJsonBtn = document.getElementById('openJsonBtn');

// ---------- загрузка JSON ----------
fetch('data/archive.json')
  .then(r => r.ok ? r.json() : { shelves: [] })
  .then(data => { archive = data; updateShelfSelect(); })
  .catch(() => updateShelfSelect());

// ---------- обновление селектов ----------
function updateShelfSelect() {
  shelfSelect.innerHTML = '';
  archive.shelves.forEach(s => shelfSelect.appendChild(new Option(s.name, s.name)));
  if (archive.shelves.length) shelfSelect.value = archive.shelves[0]?.name || '';
  updateFloorSelect();
}

function updateFloorSelect() {
  floorSelect.innerHTML = '';
  boxSelect.innerHTML = '';
  caseList.innerHTML = '';

  const shelf = archive.shelves.find(s => s.name === shelfSelect.value);
  if (!shelf) return;

  if (shelf.floors.length === 0) return; // новых этажей пока нет

  shelf.floors.forEach(f => floorSelect.appendChild(new Option(f.name, f.name)));
  floorSelect.value = shelf.floors[0].name;
  updateBoxSelect();
}

function updateBoxSelect() {
  boxSelect.innerHTML = '';
  caseList.innerHTML = '';

  const shelf = archive.shelves.find(s => s.name === shelfSelect.value);
  const floor = shelf?.floors.find(f => f.name === floorSelect.value);
  if (!floor) return;

  if (floor.boxes.length === 0) return; // новых коробок пока нет

  floor.boxes.forEach(b => boxSelect.appendChild(new Option(b.name, b.name)));
  boxSelect.value = floor.boxes[0].name;
  renderCases();
}

// ---------- выбор ----------
shelfSelect.onchange = updateFloorSelect;
floorSelect.onchange = updateBoxSelect;
boxSelect.onchange = renderCases;

// ---------- добавление ----------
addShelfBtn.onclick = () => {
  const name = prompt("Название новой полки:");
  if (!name) return;
  archive.shelves.push({ id: Date.now(), name, floors: [] });
  updateShelfSelect();
  shelfSelect.value = name;
  updateFloorSelect();
};

addFloorBtn.onclick = () => {
  const shelf = archive.shelves.find(s => s.name === shelfSelect.value);
  if (!shelf) return;
  const name = prompt("Название нового этажа:");
  if (!name) return;
  shelf.floors.push({ id: Date.now(), name, boxes: [] });
  updateFloorSelect();
  floorSelect.value = name;
  updateBoxSelect();
};

addBoxBtn.onclick = () => {
  const shelf = archive.shelves.find(s => s.name === shelfSelect.value);
  const floor = shelf?.floors.find(f => f.name === floorSelect.value);
  if (!floor) return;
  const name = prompt("Название новой коробки:");
  if (!name) return;
  floor.boxes.push({ id: Date.now(), name, cases: [] });
  updateBoxSelect();
  boxSelect.value = name;
  renderCases(); // важно!
};

// ---------- дела ----------
function renderCases() {
  caseList.innerHTML = '';
  const shelf = archive.shelves.find(s => s.name === shelfSelect.value);
  const floor = shelf?.floors.find(f => f.name === floorSelect.value);
  const box = floor?.boxes.find(b => b.name === boxSelect.value);
  if (!box) return;

  box.cases.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'case-item';

    const input = document.createElement('input');
    input.value = c;
    input.onchange = () => box.cases[i] = input.value;

    const del = document.createElement('button');
    del.textContent = "Удал.";
    del.onclick = () => { box.cases.splice(i, 1); renderCases(); };

    div.append(input, del);
    caseList.appendChild(div);
  });
}

addCaseBtn.onclick = () => {
  const shelf = archive.shelves.find(s => s.name === shelfSelect.value);
  const floor = shelf?.floors.find(f => f.name === floorSelect.value);
  const box = floor?.boxes.find(b => b.name === boxSelect.value);
  if (!box) return;
  const text = newCaseInput.value.trim();
  if (!text) return;
  box.cases.push(text);
  newCaseInput.value = '';
  renderCases();
};

// ---------- редактирование и удаление ----------
editShelfBtn.onclick = () => {
  const shelf = archive.shelves.find(s => s.name === shelfSelect.value);
  if (!shelf) return;
  const name = prompt("Новое название полки:", shelf.name);
  if (!name) return;
  shelf.name = name;
  updateShelfSelect();
  shelfSelect.value = name;
};

deleteShelfBtn.onclick = () => {
  const idx = archive.shelves.findIndex(s => s.name === shelfSelect.value);
  if (idx !== -1 && confirm("Удалить полку со всем содержимым?")) {
    archive.shelves.splice(idx, 1);
    updateShelfSelect();
  }
};

editFloorBtn.onclick = () => {
  const shelf = archive.shelves.find(s => s.name === shelfSelect.value);
  const floor = shelf?.floors.find(f => f.name === floorSelect.value);
  if (!floor) return;
  const name = prompt("Новое название этажа:", floor.name);
  if (!name) return;
  floor.name = name;
  updateFloorSelect();
  floorSelect.value = name;
};

deleteFloorBtn.onclick = () => {
  const shelf = archive.shelves.find(s => s.name === shelfSelect.value);
  const idx = shelf?.floors.findIndex(f => f.name === floorSelect.value);
  if (idx !== -1 && confirm("Удалить этаж со всем содержимым?")) {
    shelf.floors.splice(idx, 1);
    updateFloorSelect();
  }
};

editBoxBtn.onclick = () => {
  const shelf = archive.shelves.find(s => s.name === shelfSelect.value);
  const floor = shelf?.floors.find(f => f.name === floorSelect.value);
  const box = floor?.boxes.find(b => b.name === boxSelect.value);
  if (!box) return;
  const name = prompt("Новое название коробки:", box.name);
  if (!name) return;
  box.name = name;
  updateBoxSelect();
  boxSelect.value = name;
  renderCases();
};

deleteBoxBtn.onclick = () => {
  const shelf = archive.shelves.find(s => s.name === shelfSelect.value);
  const floor = shelf?.floors.find(f => f.name === floorSelect.value);
  const idx = floor?.boxes.findIndex(b => b.name === boxSelect.value);
  if (idx !== -1 && confirm("Удалить коробку со всем содержимым?")) {
    floor.boxes.splice(idx, 1);
    updateBoxSelect();
  }
};

// ---------- таблица ----------
toggleTableBtn.onclick = () => {
  if (tableContainer.style.display === "block") {
    tableContainer.style.display = "none";
    toggleTableBtn.textContent = "Показать список";
    return;
  }
  let html = "<table><tr><th>Полка</th><th>Этаж</th><th>Коробка</th><th>Содержимое</th></tr>";
  archive.shelves.forEach(s =>
    s.floors.forEach(f =>
      f.boxes.forEach(b =>
        html += `<tr><td>${s.name}</td><td>${f.name}</td><td>${b.name}</td><td>${b.cases.join(", ")}</td></tr>`
      )
    )
  );
  html += "</table>";
  tableContainer.innerHTML = html;
  tableContainer.style.display = "block";
  toggleTableBtn.textContent = "Скрыть список";
};

// ---------- JSON ----------
openJsonBtn.onclick = () => {
  const w = window.open("", "_blank");
  w.document.write(`
    <html>
      <head>
        <title>Archive JSON</title>
        <style>
          html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
          body { font-family: monospace; font-size: 24px; padding: 20px; background: #f0f4f8; }
          pre { width: 100%; height: 100%; overflow: auto; font-size: 24px; white-space: pre-wrap; word-break: break-word; }
        </style>
      </head>
      <body>
        <pre>${JSON.stringify(archive, null, 2)}</pre>
      </body>
    </html>
  `);
};


</script>


</body>
</html>
