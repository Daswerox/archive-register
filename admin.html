<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Админка Архива</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<header>
  <h1>Админка Архива</h1>
</header>

<div id="controls">
  <h2>Управление архивом</h2>

  <div>
    <label>Выбор действия:</label>
    <select id="action">
      <option value="add">Добавить</option>
      <option value="edit">Редактировать / Удалить</option>
    </select>
  </div>

  <br>

  <label>Полка:</label>
  <select id="shelfSelect"></select>
  <label>Этаж:</label>
  <select id="floorSelect"></select>
  <label>Коробка:</label>
  <select id="boxSelect"></select>
  
  <label>Содержимое коробки:</label>
  <input type="text" id="caseInput" placeholder="Платонов И.И., Иванова А.А.">

  <br><br>
  <button id="submitBtn">Применить</button>
  <button id="exportBtn">Показать список</button>
</div>

<div id="tableContainer" style="display:none;"></div>

<script src="js/admin.js"></script>
</body>
</html>
