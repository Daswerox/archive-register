<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Админка Архива</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<header>
  <h1>Админка Архива</h1>
</header>

<div id="controls">
  <h2>Управление архивом</h2>

  <!-- Выбор структуры -->
  <label>Полка:</label>
  <select id="shelfSelect"></select>
  <label>Этаж:</label>
  <select id="floorSelect"></select>
  <label>Коробка:</label>
  <select id="boxSelect"></select>

  <!-- Редактирование содержимого коробки -->
  <h3>Содержимое коробки:</h3>
  <div id="caseList"></div>
  <input type="text" id="newCaseInput" placeholder="Добавить новое дело">
  <button id="addCaseBtn">Добавить дело</button>

  <!-- Экспорт таблицы -->
  <button id="exportBtn">Показать / Скрыть список</button>
</div>

<div id="tableContainer" style="display:none;"></div>

<script src="js/admin.js"></script>
</body>
</html>
