<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Админ панель архива</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<header>
  <h1>Админка Архива</h1>
</header>

<div id="controls">
  <h2>Добавить / Редактировать</h2>
  
  <label>Выбор действия:</label>
  <select id="action">
    <option value="add">Добавить</option>
    <option value="edit">Редактировать / Удалить</option>
  </select>

  <br><br>

  <label>Полка:</label>
  <input type="text" id="shelfInput" placeholder="Полка 9">
  <label>Этаж:</label>
  <input type="text" id="floorInput" placeholder="Этаж 2">
  <label>Коробка:</label>
  <input type="text" id="boxInput" placeholder="Коробка 1">
  <label>Содержимое коробки:</label>
  <input type="text" id="caseInput" placeholder="Платонов И.И., Иванова А.А.">

  <br><br>
  <button id="submitBtn">Применить</button>
  <button id="exportBtn">Показать список</button>
</div>

<div id="tableContainer"></div>

<script src="js/admin.js"></script>
</body>
</html>
